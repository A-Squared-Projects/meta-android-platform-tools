BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "android-platform-tools"
BBFILE_PATTERN_android-platform-tools = "^${LAYERDIR}/"
# Above meta-oe (5): this layer's android-tools replaces meta-oe's.
BBFILE_PRIORITY_android-platform-tools = "7"

LAYERVERSION_android-platform-tools = "1"
# meta-oe: android-libboringssl, brotli, protobuf, android-tools-conf
LAYERDEPENDS_android-platform-tools = "core openembedded-layer"
LAYERSERIES_COMPAT_android-platform-tools = "blacksail"

# meta-oe's own append installs from paths that only exist in its recipe.
BBMASK += "meta-oe/recipes-devtools/android-tools/android-tools_%\.bbappend"
